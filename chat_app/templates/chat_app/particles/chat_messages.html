{% load static %}
<!-- Відкриваємо блок особистих повідомлень. -->
<section class="chat-messages-block">
    <!-- Заголовок з кнопкою "Дивитись всі" -->
    <div class="chat-block-header">
        <img src="{% static 'chat_app/images/PersonalChat.svg' %}" alt="Повідомлення">
        <span class="chat-block-title">Повідомлення</span>
    </div>
    <!-- Перебираємо особисті чати поточного користувача. -->
    {% for chat in personal_chats %}
        {% for person in chat.users.all %}
            {% if person.id != request.user.id %}
                <button type="button" class="chat-user-button" data-chat-user="{{ person.id }}" data-chat-username="{{ person.username|default:person.email }}">
                    {{ person.username|default:person.email }}
                </button>
            {% endif %}
        {% endfor %}
    {% empty %}
        <p>Чатів поки немає</p>
    {% endfor %}
</section>
