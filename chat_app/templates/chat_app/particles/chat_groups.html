{% load static %}
<section class="chat-groups-block">
    <div class="chat-block-header">
        <img src="{% static 'chat_app/images/GroupChat.svg' %}" alt="Групові чати">
    </div>

    <ul id="group-list">
        {% for chat in group_chats %}
            <li data-chat-id="{{ chat.id }}" data-chat-name="{{ chat.name }}">
                {{ chat.name }}
            </li>
        {% empty %}
            <p>Порожньо</p>
        {% endfor %}
    </ul>
</section>
